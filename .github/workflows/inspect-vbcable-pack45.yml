name: Inspect VB-CABLE Pack45

# Intentionally disabled in the private repository. Run the inspection locally.
on: []

permissions:
  contents: read

jobs:
  inspect-official-package:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download and inspect official standard VB-CABLE package
        id: inspect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0

          $officialUrl = 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip'
          $work = Join-Path $env:RUNNER_TEMP 'vbcable-pack45-review'
          $zip = Join-Path $work 'VBCABLE_Driver_Pack45.zip'
          $expanded = Join-Path $work 'expanded'
          $report = Join-Path $work 'VBCABLE_Driver_Pack45.review.json'

          New-Item -ItemType Directory -Force -Path $expanded | Out-Null
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -UseBasicParsing -MaximumRedirection 5 `
            -Uri $officialUrl `
            -OutFile $zip `
            -UserAgent 'SC220-Live-VBCable-Review/0.1'

          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded -Force

          $forbidden = @(Get-ChildItem -LiteralPath $expanded -Recurse -File | Where-Object {
            $_.Name -match '(?i)VBCABLE[_-]?[ABCD](?:_|-|\.)' -or
            $_.FullName -match '(?i)VBCABLE_[ABCD]_Driver'
          })
          if ($forbidden.Count -gt 0) {
            throw "Official standard package unexpectedly contains A/B/C/D material: $($forbidden.FullName -join ', ')"
          }

          $setup = Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter 'VBCABLE_Setup_x64.exe' |
            Select-Object -First 1
          if (-not $setup) { throw 'VBCABLE_Setup_x64.exe is missing.' }

          $setupSignature = Get-AuthenticodeSignature -LiteralPath $setup.FullName
          if ($setupSignature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
              -not $setupSignature.SignerCertificate) {
            throw "Setup Authenticode signature is not valid: $($setupSignature.Status)"
          }

          $catalogReports = @()
          $catalogs = @(Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter '*.cat')
          if ($catalogs.Count -eq 0) { throw 'No driver catalogues were found.' }
          foreach ($catalog in $catalogs) {
            $signature = Get-AuthenticodeSignature -LiteralPath $catalog.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid catalogue signature: $($catalog.Name) [$($signature.Status)]"
            }
            $catalogReports += [ordered]@{
              file = $catalog.Name
              sha256 = (Get-FileHash -LiteralPath $catalog.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              signature = $signature.Status.ToString()
              signer = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { '' }
            }
          }

          $reportObject = [ordered]@{
            reviewed_utc = [DateTime]::UtcNow.ToString('o')
            source = $officialUrl
            package = 'VBCABLE_Driver_Pack45.zip'
            package_size = (Get-Item -LiteralPath $zip).Length
            package_sha256 = $hash
            setup = [ordered]@{
              file = $setup.Name
              sha256 = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              signature = $setupSignature.Status.ToString()
              signer = $setupSignature.SignerCertificate.Subject
              certificate_thumbprint = $setupSignature.SignerCertificate.Thumbprint
            }
            catalogues = $catalogReports
            additional_cable_material = $false
          }
          $reportObject | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $report -Encoding UTF8

          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "report=$report" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          @"
          ## Official VB-CABLE Pack45 review

          - Package: ``VBCABLE_Driver_Pack45.zip``
          - SHA-256: ``$hash``
          - Setup signature: ``$($setupSignature.Status)``
          - Setup signer: ``$($setupSignature.SignerCertificate.Subject)``
          - Driver catalogues: ``$($catalogs.Count)`` valid
          - A/B/C/D material: not present

          Reviewed repository value:

          ``VBCABLE_PACK45_SHA256=$hash``
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Upload review report only
        uses: actions/upload-artifact@v4
        with:
          name: VBCABLE-Pack45-review-${{ steps.inspect.outputs.hash }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ steps.inspect.outputs.report }}
