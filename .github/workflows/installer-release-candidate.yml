name: SC220 Live installer release candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: SC220 Live branch, tag, or commit to build
        required: true
        default: fix/pc-cable-source-analyzer
        type: string
      version:
        description: Semantic version
        required: true
        default: 0.1.0
        type: string
      clean:
        description: Perform a clean build
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - .github/workflows/installer-release-candidate.yml

permissions:
  contents: read

jobs:
  windows-installer-release-candidate:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'fix/pc-cable-source-analyzer' }}
      RELEASE_VERSION: ${{ inputs.version || '0.1.0' }}
      CLEAN_BUILD: ${{ inputs.clean || 'true' }}
      ASKP_REPO_TOKEN: ${{ secrets.ASKP_REPO_TOKEN }}
    steps:
      - name: Require private ASK-P credential
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ASKP_REPO_TOKEN)) {
            throw 'Repository secret ASKP_REPO_TOKEN is required. Use a fine-grained token with read-only Contents access to masarray/askp-vst.'
          }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid semantic version: $env:RELEASE_VERSION"
          }

      - name: Checkout exact SC220 Live release-candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          submodules: false
          fetch-depth: 1

      - name: Resolve pinned source and VB-CABLE authorities
        id: authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceCommit = (git rev-parse HEAD).Trim()
          $lockPath = Join-Path $env:GITHUB_WORKSPACE 'VB_CABLE_AUTHORITY.lock'
          if (-not (Test-Path -LiteralPath $lockPath -PathType Leaf)) {
            throw 'VB_CABLE_AUTHORITY.lock is missing from the selected release source.'
          }

          $lock = @{}
          foreach ($line in Get-Content -LiteralPath $lockPath) {
            if ($line -match '^([^=]+)=(.*)$') {
              $lock[$Matches[1].Trim()] = $Matches[2].Trim()
            }
          }
          $vbHash = $lock['package_sha256']
          if ($vbHash -notmatch '^[A-Fa-f0-9]{64}$') {
            throw 'VB_CABLE_AUTHORITY.lock does not contain a valid package_sha256.'
          }
          if ($lock['additional_cable_material'] -ne 'false' -or
              $lock['setup_signature'] -ne 'Valid') {
            throw 'VB-CABLE authority lock is not approved for the standard signed package.'
          }

          "source_commit=$sourceCommit" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "vb_hash=$($vbHash.ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source_commit=$sourceCommit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VBCABLE_PACK45_SHA256=$($vbHash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          @"
          ## Release-candidate authority

          - SC220 Live ref: ``$env:SOURCE_REF``
          - SC220 Live commit: ``$sourceCommit``
          - ASK-P commit: ``5757119cab7a1a75f09dcf0edea6e3be97975439``
          - VB-CABLE Pack45 SHA-256: ``$($vbHash.ToLowerInvariant())``
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Checkout pinned private ASK-P authority
        uses: actions/checkout@v4
        with:
          repository: masarray/askp-vst
          ref: 5757119cab7a1a75f09dcf0edea6e3be97975439
          token: ${{ secrets.ASKP_REPO_TOKEN }}
          path: third_party/askp-vst
          fetch-depth: 1

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Validate release and installer contracts
        shell: pwsh
        run: |
          .\scripts\check-sc220-release-contract.ps1
          python .\qa\audit_sc220_installer_bundle.py

      - name: Build verified Windows x64 installer candidate
        shell: pwsh
        run: |
          $arguments = @(
            '-Version', $env:RELEASE_VERSION,
            '-VBCableSha256', $env:VBCABLE_PACK45_SHA256
          )
          if ($env:CLEAN_BUILD -eq 'true') { $arguments += '-Clean' }
          & .\scripts\package-sc220-installer.ps1 @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke install application payload without driver changes
        shell: pwsh
        run: |
          $installer = Get-ChildItem .\dist -File -Filter "SC220-Live-v$env:RELEASE_VERSION-Setup-win-x64.exe" |
            Select-Object -First 1
          if (-not $installer) { throw 'Installer candidate was not produced.' }

          $smokeDir = Join-Path $env:RUNNER_TEMP 'SC220 Live Installer Smoke'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/TASKS="!vbcable,!desktopicon"',
            "/DIR=`"$smokeDir`""
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installer smoke test failed with exit code $($process.ExitCode)."
          }

          $installedExe = Join-Path $smokeDir 'SC220 Live.exe'
          if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
            throw 'Installer completed without SC220 Live.exe.'
          }
          foreach ($file in @(
            'Legal\EULA.txt',
            'Legal\PURCHASE_TERMS.txt',
            'Legal\THIRD_PARTY_NOTICES.md',
            'Legal\VB_AUDIO_NOTICE.txt'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $smokeDir $file) -PathType Leaf)) {
              throw "Installer smoke payload is missing: $file"
            }
          }

          $uninstaller = Join-Path $smokeDir 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw 'Installer smoke test did not create the uninstaller.'
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Installer smoke uninstall failed with exit code $($uninstall.ExitCode)."
          }

      - name: Record exact candidate source
        shell: pwsh
        run: |
          Set-Content -LiteralPath .\dist\BUILD_COMMIT.txt -Value $env:source_commit -Encoding ASCII
          Set-Content -LiteralPath .\dist\VB_CABLE_PACK45_SHA256.txt -Value $env:VBCABLE_PACK45_SHA256 -Encoding ASCII

      - name: Upload installer release candidate
        uses: actions/upload-artifact@v4
        with:
          name: SC220-Live-v${{ env.RELEASE_VERSION }}-installer-RC-${{ steps.authority.outputs.source_commit }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/SC220-Live-v${{ env.RELEASE_VERSION }}-Setup-win-x64.exe
            dist/SC220-Live-v${{ env.RELEASE_VERSION }}-Setup-win-x64.exe.sha256
            dist/SC220-Live-v${{ env.RELEASE_VERSION }}-Setup-win-x64.manifest.json
            dist/BUILD_COMMIT.txt
            dist/VB_CABLE_PACK45_SHA256.txt
