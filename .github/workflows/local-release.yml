name: SC220 Live local build and public release

# Archived implementation only. Never dispatch this workflow: private source
# builds and QA run directly on the Windows workstation, while publication is
# performed by the public sc220-download draft workflow.
on: []

permissions:
  contents: read

concurrency:
  group: sc220-live-local-public-release
  cancel-in-progress: false

jobs:
  build-test-publish:
    name: Build, smoke test, and publish from local Windows
    runs-on: [self-hosted, Windows, X64, sc220-build]
    timeout-minutes: 180
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_REF: ${{ inputs.source_ref }}
      CLEAN_BUILD: ${{ inputs.clean }}
      RELEASE_CHANNEL: ${{ inputs.release_channel }}
      RELEASE_NOTES: ${{ inputs.release_notes }}

    steps:
      - name: Validate manual release request
        shell: powershell
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid semantic version: $env:RELEASE_VERSION"
          }
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_REF)) {
            throw 'source_ref cannot be empty.'
          }
          if ($env:RELEASE_CHANNEL -notin @('stable', 'prerelease')) {
            throw "Invalid release channel: $env:RELEASE_CHANNEL"
          }

      - name: Checkout exact SC220 Live source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          submodules: false
          clean: true
          persist-credentials: false

      - name: Checkout pinned private ASK-P authority
        uses: actions/checkout@v4
        with:
          repository: masarray/askp-vst
          ref: 2c764f82b0fc99eaff04d918cef4f839db7509e5
          token: ${{ secrets.ASKP_REPO_TOKEN }}
          path: third_party/askp-vst
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve pinned prerequisite authorities
        id: authority
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Read-Lock([string]$Path) {
            $values = @{}
            foreach ($line in Get-Content -LiteralPath $Path) {
              if ($line -match '^([^=]+)=(.*)$') {
                $values[$Matches[1].Trim()] = $Matches[2].Trim()
              }
            }
            return $values
          }

          $askp = Read-Lock '.\ASKP_AUTHORITY.lock'
          $vb = Read-Lock '.\VB_CABLE_AUTHORITY.lock'
          $vc = Read-Lock '.\VC_REDIST_AUTHORITY.lock'
          foreach ($item in @($askp['authority_commit'], $vb['package_sha256'], $vc['package_sha256'])) {
            if ([string]::IsNullOrWhiteSpace($item)) {
              throw 'A release authority lock is missing a required value.'
            }
          }
          if ($askp['authority_commit'] -notmatch '^[A-Fa-f0-9]{40}$') {
            throw 'ASKP_AUTHORITY.lock has an invalid authority_commit.'
          }
          foreach ($item in @($vb['package_sha256'], $vc['package_sha256'])) {
            if ($item -notmatch '^[A-Fa-f0-9]{64}$') {
              throw 'A prerequisite authority lock has an invalid package_sha256.'
            }
          }

          $askpExpected = $askp['authority_commit'].ToLowerInvariant()
          $askpActual = (& git -C .\third_party\askp-vst rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $askpActual -ne $askpExpected) {
            throw "ASK-P checkout mismatch. Expected $askpExpected but found $askpActual."
          }

          $sourceCommit = (git rev-parse HEAD).Trim()
          "VBCABLE_PACK45_SHA256=$($vb['package_sha256'].ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_COMMIT=$sourceCommit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "source_commit=$sourceCommit" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

          @"
          ## Local release authority

          - Source ref: ``$env:SOURCE_REF``
          - Source commit: ``$sourceCommit``
          - ASK-P commit: ``$askpExpected``
          - VC Runtime SHA-256: ``$($vc['package_sha256'].ToLowerInvariant())``
          - VB-CABLE SHA-256: ``$($vb['package_sha256'].ToLowerInvariant())``
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Verify local build machine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($command in @('git.exe', 'cmake.exe', 'ninja.exe', 'gh.exe')) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "$command is not available to the runner service. Re-run SETUP-LOCAL-RUNNER.cmd."
            }
          }

          if (-not (Get-Command py.exe -ErrorAction SilentlyContinue) -and
              -not (Get-Command python.exe -ErrorAction SilentlyContinue)) {
            throw 'Python is not available to the runner service.'
          }

          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } |
            Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 6 is not installed for the local runner.' }

          $vswhere = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\Installer\vswhere.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } |
            Select-Object -First 1
          if (-not $vswhere) { throw 'Visual Studio Build Tools was not found.' }
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $vs) { throw 'MSVC Desktop development with C++ workload was not found.' }

          Write-Host "Inno Setup : $iscc"
          Write-Host "MSVC       : $($vs.Trim())"

      - name: Prepare persistent JUCE 8.0.14 cache
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cacheRoot = Join-Path $env:ProgramData 'MasArray\SC220ReleaseCache'
          $juceDir = Join-Path $cacheRoot 'JUCE-8.0.14'
          New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null

          $valid = $false
          if (Test-Path -LiteralPath (Join-Path $juceDir 'CMakeLists.txt') -PathType Leaf) {
            $dirty = (& git -C $juceDir status --porcelain 2>$null | Out-String).Trim()
            $tag = (& git -C $juceDir describe --tags --exact-match HEAD 2>$null | Select-Object -First 1)
            $valid = ($LASTEXITCODE -eq 0 -and -not $dirty -and $tag -and $tag.Trim() -eq '8.0.14')
          }

          if (-not $valid) {
            if (Test-Path -LiteralPath $juceDir) {
              Remove-Item -LiteralPath $juceDir -Recurse -Force
            }
            Write-Host 'Caching JUCE 8.0.14 once for future clean releases...'
            & git clone --depth 1 --branch 8.0.14 https://github.com/juce-framework/JUCE.git $juceDir
            if ($LASTEXITCODE -ne 0) { throw 'Unable to populate the persistent JUCE cache.' }
          } else {
            Write-Host "JUCE cache hit: $juceDir" -ForegroundColor Green
          }

          "JUCE_DIR=$juceDir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate source and installer contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\check-sc220-release-contract.ps1

          if (Get-Command py.exe -ErrorAction SilentlyContinue) {
            $pythonExe = 'py.exe'
            $pythonArgs = @('-3')
          } else {
            $pythonExe = 'python.exe'
            $pythonArgs = @()
          }

          & $pythonExe @pythonArgs .\qa\audit_sc220_installer_bundle.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $pythonExe @pythonArgs .\qa\audit_sc220_local_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $pythonExe @pythonArgs .\qa\audit_v0150_askp_p03_port.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build verified smart installer locally
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $packageArgs = @{
            Version = $env:RELEASE_VERSION
            VBCableSha256 = $env:VBCABLE_PACK45_SHA256
          }
          if ($env:CLEAN_BUILD -eq 'true') { $packageArgs.Clean = $true }
          & .\scripts\package-sc220-installer.ps1 @packageArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke install, prerequisite probe, and uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem .\dist -File -Filter "SC220-Live-v$env:RELEASE_VERSION-Setup-win-x64.exe" |
            Select-Object -First 1
          if (-not $installer) { throw 'Smart installer was not produced.' }

          $smokeDir = Join-Path $env:RUNNER_TEMP 'SC220 Live Local Release Smoke'
          if (Test-Path -LiteralPath $smokeDir) {
            Remove-Item -LiteralPath $smokeDir -Recurse -Force
          }

          try {
            $install = Start-Process -FilePath $installer.FullName -ArgumentList @(
              '/VERYSILENT',
              '/SUPPRESSMSGBOXES',
              '/NORESTART',
              '/TASKS="!vbcable,!desktopicon"',
              "/DIR=`"$smokeDir`"",
              "/LOG=`"$(Join-Path $env:RUNNER_TEMP 'SC220-local-install.log')`""
            ) -Wait -PassThru
            if ($install.ExitCode -ne 0) {
              throw "Installer smoke test failed with exit code $($install.ExitCode)."
            }

            foreach ($file in @(
              'SC220 Live.exe',
              'Tools\SC220PrerequisiteProbe.ps1',
              'Legal\EULA.txt',
              'Legal\PURCHASE_TERMS.txt',
              'Legal\THIRD_PARTY_NOTICES.md',
              'Legal\VB_AUDIO_NOTICE.txt',
              'unins000.exe'
            )) {
              if (-not (Test-Path -LiteralPath (Join-Path $smokeDir $file) -PathType Leaf)) {
                throw "Installed payload is missing: $file"
              }
            }

            $probe = Join-Path $smokeDir 'Tools\SC220PrerequisiteProbe.ps1'
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $probe -Mode Core
            if ($LASTEXITCODE -ne 0) {
              throw "Installed prerequisite probe failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            $uninstaller = Join-Path $smokeDir 'unins000.exe'
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
                '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
              ) -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) {
                Write-Warning "Smoke uninstall returned exit code $($uninstall.ExitCode)."
              }
            }
          }

      - name: Publish release and update sc220-download website
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.SC220_DOWNLOAD_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\publish-sc220-download.ps1 `
            -Version $env:RELEASE_VERSION `
            -SourceCommit $env:SOURCE_COMMIT `
            -Channel $env:RELEASE_CHANNEL `
            -ReleaseNotes $env:RELEASE_NOTES
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "## Public release`n`nhttps://github.com/masarray/sc220-download/releases/tag/v$env:RELEASE_VERSION" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Remove temporary release and private-authority files
        if: always()
        shell: powershell
        run: |
          foreach ($path in @('.\.release-work', '.\third_party\askp-vst')) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
