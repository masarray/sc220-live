name: SC220 Live | Linux and macOS preview

on:
  pull_request:
    paths:
      - '.github/workflows/portable-release.yml'
      - 'scripts/package-portable.sh'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'live/**'
      - 'qa/**'
      - 'third_party/**'
      - 'docs/PORTABLE_RELEASE.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/portable-release.yml'
      - 'scripts/package-portable.sh'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'live/**'
      - 'qa/**'
      - 'third_party/**'
      - 'docs/PORTABLE_RELEASE.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Preview release tag (must match the current CMake project version)'
        required: true
        default: 'v0.1.2-portable-preview.1'
        type: string
      publish_release:
        description: 'Publish tested binaries to the PRIVATE sc220-live GitHub Releases'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }} / build and audit
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            os: linux
          - name: macOS Intel + Apple Silicon
            runner: macos-15
            os: macos

    steps:
      - name: Checkout pinned private audio authority
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN alone generally cannot read another private repository.
          # Configure SC220_SUBMODULE_TOKEN with read access to masarray/askp-vst.
          token: ${{ secrets.SC220_SUBMODULE_TOKEN || github.token }}
          submodules: recursive
          persist-credentials: false

      - name: Assert private authority was checked out
        shell: bash
        run: |
          test -f third_party/askp-vst/engine/arsonkupik_dsp.cpp
          test -f third_party/askp-vst/scripts/generate_p0_musical_rebalance_dsp.py
          test "$(git -C third_party/askp-vst rev-parse HEAD)" = "2c764f82b0fc99eaff04d918cef4f839db7509e5"

      - name: Install Linux JUCE development dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libgl1-mesa-dev

      - name: Configure Release
        shell: bash
        run: |
          extra=()
          if [[ "${{ matrix.os }}" == 'macos' ]]; then
            extra+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64")
            extra+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0")
          fi
          cmake -S . -B build/portable -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSONKUPIK_BUILD_PARITY_QA=OFF \
            "${extra[@]}"

      - name: Build GUI application and compiled QA
        shell: bash
        run: |
          cmake --build build/portable --config Release --parallel 3 \
            --target SC220Live SC220LoudnessAudit SC220ProgrammeAnalyzerAudit SC220PleasantPresenceAudit

      - name: Run compiled DSP and telemetry QA
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == 'linux' ]]; then
            xvfb-run -a ctest --test-dir build/portable -C Release --output-on-failure
          else
            ctest --test-dir build/portable -C Release --output-on-failure
          fi

      - name: Package native application
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            version='${{ inputs.version }}'
          else
            version='v0.1.2-portable-preview.1'
          fi
          bash scripts/package-portable.sh "${{ matrix.os }}" "$version" build/portable

      - name: Upload preview package and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: SC220-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Private prerelease (only by explicit dispatch)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect tested release packages
        uses: actions/download-artifact@v4
        with:
          pattern: SC220-*-${{ github.sha }}
          path: dist
          merge-multiple: true
      - name: Validate immutable release identity and assets
        shell: bash
        env:
          TAG_NAME: ${{ inputs.version }}
        run: |
          [[ "$TAG_NAME" =~ ^v0\.1\.2-portable-preview\.[0-9]+$ ]] || {
            echo "Only versioned 0.1.2 portable previews are permitted by this workflow." >&2
            exit 2
          }
          test "$(find dist -maxdepth 1 -name '*.dmg' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          (cd dist && for checksum in *.sha256; do shasum -a 256 -c "$checksum"; done)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, refusing to overwrite assets."
            exit 3
          fi
      - name: Publish PRIVATE preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.version }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "SC220 Live $TAG_NAME — Linux x64 / macOS universal preview" \
            --notes-file docs/PORTABLE_RELEASE.md
