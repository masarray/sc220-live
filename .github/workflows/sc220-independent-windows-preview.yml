name: SC220 independent Windows VST3 host — CI preview
on:
  push:
    branches: [feature/asio-input-vst3-and-public-runner-cleanup]
    paths:
      - 'CMakeLists.txt'
      - 'standalone_vst_host/**'
      - '.github/workflows/sc220-independent-windows-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sc220-independent-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Enforce public source independence
        shell: pwsh
        run: |
          if (-not (Select-String -Path CMakeLists.txt -SimpleMatch 'option(SC220_EXTERNAL_VST_ONLY "Build independent first-party/external VST3 live host" ON)')) { throw 'External VST host not default.' }
          if (-not (Test-Path standalone_vst_host/SC220ExternalHost.cpp)) { throw 'Host missing.' }
          if (-not (Test-Path standalone_vst_host/SC220ExternalVstHost.cmake)) { throw 'Independent CMake missing.' }
      - name: Configure Windows x64 independent ASIO/VST3 host
        shell: pwsh
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 -DSC220_EXTERNAL_VST_ONLY=ON
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed.' }
      - name: Compile Release EXE
        shell: pwsh
        run: |
          cmake --build build --target SC220Live --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'MSVC compile failed.' }
      - name: Fetch and verify official ArSonKuPik + ArSonVerb VST3 assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(
            @{
              Label = 'ArSonKuPik'
              Name = 'ArSonKuPik-v0.5.26-Windows-x64-VST3.zip'
              URL = 'https://github.com/masarray/vst-enhancer/releases/download/v0.5.26/'
              SHA = 'e53287c871166bcdc945b4962d7a38b5c93ad6cb0c0fa0bdd02fa42ff47cd5b6'
            },
            @{
              Label = 'ArSonVerb'
              Name = 'ArSonVerb-Windows-x64-VST3-v1.0.1.zip'
              URL = 'https://github.com/masarray/arsonverb/releases/download/v1.0.1/'
              SHA = '41fdf9132f26e55a1671fe6f00409a5219199b245be4dbccb7615fc4dd7c3e7b'
            }
          )
          foreach ($asset in $assets) {
            $name = $asset.Name
            Invoke-WebRequest -Uri ($asset.URL + $name) -OutFile $name -MaximumRedirection 10
            $actual = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $asset.SHA) {
              throw "$($asset.Label) SHA256 mismatch. Expected $($asset.SHA), got $actual"
            }
            $dest = Join-Path 'unpacked-vst' $asset.Label
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Expand-Archive -LiteralPath $name -DestinationPath $dest -Force
            Write-Host "Verified $($asset.Label) archive: $actual"
            # Accept both Windows single-file .vst3 and directory .vst3 bundles.
            $bundles = @(Get-ChildItem -Path $dest -Recurse -Force |
              Where-Object { $_.Name.EndsWith('.vst3', [StringComparison]::OrdinalIgnoreCase) })
            if ($bundles.Count -eq 0) {
              Get-ChildItem -Path $dest -Recurse -Force |
                Select-Object -First 45 FullName, Length | Format-Table | Out-String | Write-Host
              throw "$($asset.Label) archive has no .vst3 bundle or file"
            }
          }
      - name: Package unsigned Windows preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path build -Recurse -File -Filter '*.exe' |
            Where-Object { $_.Name -match '^SC220.?Live.exe$' -and $_.FullName -match '\\Release\\' } |
            Select-Object -First 1
          if (-not $exe) { throw 'SC220 Release EXE not found.' }
          New-Item -ItemType Directory preview -Force | Out-Null
          Copy-Item $exe.FullName preview/
          New-Item -ItemType Directory preview/plugins -Force | Out-Null
          foreach ($product in @('ArSonKuPik', 'ArSonVerb')) {
            $src = Join-Path 'unpacked-vst' $product
            # A bundle directory commonly contains a second .vst3 DLL.
            # Always copy the OUTERMOST .vst3, not both parent and child.
            $package = Get-ChildItem -Path $src -Recurse -Directory -Force |
              Where-Object { $_.Name.EndsWith('.vst3', [StringComparison]::OrdinalIgnoreCase) } |
              Sort-Object { $_.FullName.Length } | Select-Object -First 1
            if (-not $package) {
              $package = Get-ChildItem -Path $src -Recurse -File -Force |
                Where-Object { $_.Name.EndsWith('.vst3', [StringComparison]::OrdinalIgnoreCase) } |
                Select-Object -First 1
            }
            if (-not $package) { throw "No .vst3 payload found for $product" }
            Copy-Item -LiteralPath $package.FullName -Destination preview/plugins -Recurse -Force
            Write-Host "Staged outer VST3: $($package.FullName)"
          }
          @'
          ArSonKuPik v0.5.26
          https://github.com/masarray/vst-enhancer/releases/tag/v0.5.26
          SHA256 ZIP e53287c871166bcdc945b4962d7a38b5c93ad6cb0c0fa0bdd02fa42ff47cd5b6
          ArSonVerb v1.0.1
          https://github.com/masarray/arsonverb/releases/tag/v1.0.1
          SHA256 ZIP 41fdf9132f26e55a1671fe6f00409a5219199b245be4dbccb7615fc4dd7c3e7b
          '@ | Set-Content preview/VST3-PROVENANCE.txt
          "Build SHA: $env:GITHUB_SHA" | Set-Content preview/BUILD-INFO.txt
          "SHA256: $((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)" | Add-Content preview/BUILD-INFO.txt
          @'
          SC220 independent VST3 host - DEVELOPMENT PREVIEW
          Bundled: ArSonKuPik v0.5.26 on FX 1 (both channels),
          ArSonVerb v1.0.1 on FX 2 (Voice). FX 3 free per channel.
          All archives verified against pinned SHA256; no ASK-P source. Windows Setup -> select ASIO or WASAPI.
          Input 1/2 = Voice; Input 3/4 = Music (when supported by device).
          GO LIVE is muted by default. Test routing with monitors off first.
          Audio hardware, editor, streaming and DSP parity remain unverified.
          This is NOT the former full SC220 console or stable public release.
          '@ | Set-Content preview/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sc220-independent-windows-vst3-preview
          path: preview/
          retention-days: 7
          if-no-files-found: error
