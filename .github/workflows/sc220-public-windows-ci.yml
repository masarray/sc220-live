name: SC220 Public Windows ASIO VST3 Build
on:
  push:
    branches: [main, feature/original-ui-studio-one-fx-racks]
    paths:
      - 'live/**'
      - 'cmake/**'
      - 'qa/**'
      - 'assets/**'
      - 'CMakeLists.txt'
      - '.github/workflows/sc220-public-windows-ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # Preview publishing is guarded to a maintainer branch push.

concurrency:
  group: sc220-public-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    if: github.event_name != 'pull_request' || github.head_ref != 'feature/original-ui-studio-one-fx-racks'
    runs-on: windows-2022
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Source safety and effective generated engine
        shell: pwsh
        run: |
          python qa/audit_sc220_asio_vst3.py
          if ($LASTEXITCODE -ne 0) { throw "Public realtime source audit failed" }
          cmake -P qa/verify_effective_cmake_pipeline.cmake
          if ($LASTEXITCODE -ne 0) { throw "CMake generator contract failed" }
      - name: Configure Windows x64 (public source, no secrets)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
      - name: Compile SC220 Live and independent QA
        shell: pwsh
        run: |
          cmake --build build --config Release --target SC220Live SC220LoudnessAudit SC220ProgrammeAnalyzerAudit SC220PleasantPresenceAudit SC220BundledVstSmoke --parallel 3
          if ($LASTEXITCODE -ne 0) { throw "Windows Release compilation failed" }
      - name: Run CTest
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Windows QA failed" }
      - name: Verify official ArSonKuPik VST3 SHA-256 and stage app
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $url="https://github.com/masarray/vst-enhancer/releases/download/v0.5.26/ArSonKuPik-v0.5.26-Windows-x64-VST3.zip"
          $expected="e53287c871166bcdc945b4962d7a38b5c93ad6cb0c0fa0bdd02fa42ff47cd5b6"
          Invoke-WebRequest -Uri $url -OutFile "arsonkupik-vst3.zip" -MaximumRedirection 5
          $actual=(Get-FileHash "arsonkupik-vst3.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw "OFFICIAL VST3 SHA256 MISMATCH: $actual" }
          Expand-Archive -Path "arsonkupik-vst3.zip" -DestinationPath "vst-archive" -Force
          $bundle=Get-ChildItem -Path "vst-archive" -Filter "*.vst3" -Recurse |
            Where-Object { $_.PSIsContainer -or $_.Extension -eq ".vst3" } | Select-Object -First 1
          if (-not $bundle) { throw "Expected ArSonKuPik.vst3 binary bundle missing from official release" }
          # End-to-end host proof: two actual plugin instances, mandatory macros,
          # startup plus bypass, finite DSP output. Fail package on any mismatch.
          $smoke=Get-ChildItem -Path "build/SC220BundledVstSmoke_artefacts" -Filter "*.exe" -File -Recurse |
            Where-Object { $_.FullName -match "\\Release\\" } | Select-Object -First 1
          if (-not $smoke) { throw "VST3 executable smoke test missing" }
          & $smoke.FullName $bundle.FullName
          if ($LASTEXITCODE -ne 0) { throw "Bundled ArSonKuPik VST3 binary failed host smoke test" }
          $exe=Get-ChildItem -Path "build/SC220Live_artefacts" -Recurse -Filter "*.exe" -File |
            Where-Object { $_.FullName -match "\\Release\\" } | Select-Object -First 1
          if (-not $exe) { throw "SC220 Windows Release EXE missing" }
          New-Item -ItemType Directory -Path "sc220-staged/Plugins" -Force | Out-Null
          Copy-Item -LiteralPath $exe.FullName -Destination "sc220-staged/"
          Copy-Item -LiteralPath $bundle.FullName -Destination "sc220-staged/Plugins/ArSonKuPik.vst3" -Recurse -Force
          "SC220 commit: ${{ github.sha }}" | Set-Content "sc220-staged/BUILD-INFO.txt"
          "Pinned bundled VST3: v0.5.26 / SHA256 $actual" | Add-Content "sc220-staged/BUILD-INFO.txt"
          "PREVIEW: test ASIO 48 kHz / 256, 128, 64 samples; verify Voice & Music plugins and licensing before stable release." |
            Add-Content "sc220-staged/BUILD-INFO.txt"
          Compress-Archive -Path "sc220-staged/*" -DestinationPath "SC220-Live-Windows-x64-VST3-bundled-preview.zip" -CompressionLevel Optimal -Force
      - name: Verify official ArSonVerb VST3 and bundle FX2
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $url="https://github.com/masarray/arsonverb/releases/download/v1.0.1/ArSonVerb-Windows-x64-VST3-v1.0.1.zip"
          $expected="41fdf9132f26e55a1671fe6f00409a5219199b245be4dbccb7615fc4dd7c3e7b"
          Invoke-WebRequest -Uri $url -OutFile "arsonverb-vst3.zip" -MaximumRedirection 5
          $actual=(Get-FileHash "arsonverb-vst3.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw "ArSonVerb SHA256 mismatch: $actual" }
          Expand-Archive -Path "arsonverb-vst3.zip" -DestinationPath "verb-unpacked" -Force
          # Select the outermost VST3 package. Directory bundles can contain
          # another .vst3 binary inside, which must NOT be copied twice.
          $bundle=Get-ChildItem "verb-unpacked" -Directory -Recurse -Force |
            Where-Object { $_.Name.EndsWith('.vst3',[StringComparison]::OrdinalIgnoreCase) } |
            Sort-Object { $_.FullName.Length } | Select-Object -First 1
          if (-not $bundle) {
            $bundle=Get-ChildItem "verb-unpacked" -File -Recurse -Force |
              Where-Object { $_.Name.EndsWith('.vst3',[StringComparison]::OrdinalIgnoreCase) } |
              Select-Object -First 1
          }
          if (-not $bundle) { throw "Official ArSonVerb VST3 not found" }
          Copy-Item -LiteralPath $bundle.FullName -Destination "sc220-staged/Plugins/ArSonVerb.vst3" -Recurse -Force
          "Bundled ArSonVerb v1.0.1: SHA256 $actual" | Add-Content "sc220-staged/BUILD-INFO.txt"
          # Regenerate artifact so the signed-in CI user downloads ONE complete
          # SC220+ArSonKuPik+ArSonVerb ZIP, not a partial plugin set.
          Compress-Archive -Path "sc220-staged/*" -DestinationPath "SC220-Live-Windows-x64-VST3-bundled-preview.zip" -CompressionLevel Optimal -Force
      - name: Upload Windows test build (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: SC220-Live-Windows-x64-ASIO-VST3-public-preview
          path: SC220-Live-Windows-x64-VST3-bundled-preview.zip
          retention-days: 7
          if-no-files-found: error
      - name: Publish public hardware-test ZIP (PR #14, never stable)
        if: github.event_name == 'push' && github.ref_name == 'feature/original-ui-studio-one-fx-racks' && contains(github.event.head_commit.message, '[publish-preview]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $short=$env:GITHUB_SHA.Substring(0,8)
          $tag="v0.1.3-original-ui-fx3-preview.$short"
          $zip="SC220-Live-Original-GUI-ASIO-FX3-$short.zip"
          Copy-Item -LiteralPath "SC220-Live-Windows-x64-VST3-bundled-preview.zip" -Destination $zip
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          SC220 Live Original GUI + native ASIO + per-channel 3 FX inserts
          WINDOWS PHYSICAL TEST PREVIEW — NOT PRODUCTION STABLE

          Source commit: $env:GITHUB_SHA
          ZIP SHA256: $hash

          Restores original SC220MainComponent UI, approved SVG fader thumb,
          Voice/PC Audio 3-slot VST3 DAW inserts, original PC loopback, Smart
          Enhancer, monitoring, loudness, ducking and master routing.
          Pinned ArSonKuPik v0.5.26 + ArSonVerb v1.0.1.
          Voice FX2 auto-loads bundled ArSonVerb.

          Unzip completely, keep Plugins/ beside EXE.
          Begin with the physical output muted and low monitoring levels.
          Choose correct ASIO driver, then test 48 kHz at 256/128/64 samples.
          Record any problems with startup plugins, latency or GUI layout.
          This build passed CI, not hardware endurance or screenshot parity.
          "@ | Set-Content "physical-test-notes.txt"
          gh release create $tag $zip --target $env:GITHUB_SHA --prerelease --title "SC220 Original GUI + ASIO 3 FX Hardware Test ($short)" --notes-file "physical-test-notes.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Public hardware preview publication failed.' }
