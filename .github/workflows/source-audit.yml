name: SC220 Live source audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASKP_REPO_TOKEN: ${{ secrets.ASKP_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-audit dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Generate aligned monitor-enabled SC220 sources
        run: >-
          cmake
          -DSC220_UI_SOURCE=${{ github.workspace }}/live/SC220MainComponent.cpp
          -DSC220_UI_GENERATED_SOURCE=${{ runner.temp }}/SC220MainComponent_Aligned.cpp
          -P cmake/GenerateSC220AlignedUi.cmake
      - name: Validate SC220 MIXER-01 device auto-detection
        run: python qa/audit_p0_sc220_device_detection.py
      - name: Validate real Windows Stream Output endpoint names
        run: python qa/audit_sc220_real_stream_endpoints.py
      - name: Validate Sonkupik static-noise clean integration
        run: python qa/audit_sc220_static_noise_clean.py
      - name: Guard proven monitor and programme analyzer runtime paths
        run: python qa/audit_sc220_runtime_regression_guard.py
      - name: Validate actual runtime sample-rate and buffer telemetry
        run: python qa/audit_sc220_runtime_clock_status.py
      - name: Validate ASK-P v0.5.23 port boundary
        run: python qa/audit_v0140_askp_v0523_port.py
      - name: Validate SC220 dual-source broadcast bus
        run: python qa/audit_sc220_dual_source_bus.py
      - name: Validate SC220 premium UX contract
        run: python qa/audit_sc220_premium_ux.py
      - name: Validate aligned console and analyzer bridge
        run: python qa/audit_sc220_console_alignment.py
      - name: Validate independent physical Monitor Bus
        run: python qa/audit_sc220_monitor_bus.py
      - name: Validate selectable PC endpoint and anti-loop routing
        run: python qa/audit_sc220_pc_endpoint_routing.py
      - name: Validate clean-build executable unlock order
        run: python qa/audit_sc220_clean_build.py
      - name: Validate fixed transform reference
        run: python qa/verify_fixed_fft.py
      - name: Checkout private ASK-P authority when CI token is configured
        if: ${{ env.ASKP_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: masarray/askp-vst
          ref: 5757119cab7a1a75f09dcf0edea6e3be97975439
          token: ${{ secrets.ASKP_REPO_TOKEN }}
          path: third_party/askp-vst
      - name: Compile current profile and DSP audit
        if: ${{ env.ASKP_REPO_TOKEN != '' }}
        run: >-
          g++ -std=c++17 -O2
          -Ithird_party/askp-vst/engine
          qa/preset_profile_v0519_audit.cpp
          third_party/askp-vst/engine/arsonkupik_dsp.cpp
          third_party/askp-vst/engine/arsonkupik_presets.cpp
          -o /tmp/sonkupik-preset-profile-audit
      - name: Run current profile and DSP audit
        if: ${{ env.ASKP_REPO_TOKEN != '' }}
        run: /tmp/sonkupik-preset-profile-audit