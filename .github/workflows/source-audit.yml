name: Sonkupik Live source audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical reference dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Validate source architecture
        run: python qa/audit_v082.py
      - name: Validate fixed transform reference
        run: python qa/verify_fixed_fft.py
