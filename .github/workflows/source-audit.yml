name: SC220 Live source audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASKP_REPO_TOKEN: ${{ secrets.ASKP_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-audit dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Generate aligned monitor-enabled SC220 sources
        run: >-
          cmake
          -DSC220_UI_SOURCE=${{ github.workspace }}/live/SC220MainComponent.cpp
          -DSC220_UI_GENERATED_SOURCE=${{ runner.temp }}/SC220MainComponent_Aligned.cpp
          -P cmake/GenerateSC220AlignedUi.cmake
      - name: Validate ASK-P v0.5.23 port boundary
        run: python qa/audit_v0140_askp_v0523_port.py
      - name: Validate SC220 dual-source broadcast bus
        run: python qa/audit_sc220_dual_source_bus.py
      - name: Validate SC220 premium UX contract
        run: python qa/audit_sc220_premium_ux.py
      - name: Validate aligned console and atomic band visualizer
        run: python qa/audit_sc220_console_alignment.py
      - name: Validate synthetic band-pass response
        run: python qa/audit_sc220_spectralizer_response.py
      - name: Validate atomic post-limiter telemetry
        run: python qa/audit_sc220_atomic_bands.py
      - name: Compile atomic band telemetry
        run: g++ -std=c++17 -O2 qa/programme_band_telemetry_test.cpp -o /tmp/programme-band-test
      - name: Run atomic band telemetry
        run: /tmp/programme-band-test
      - name: Validate OBS-style native WASAPI Monitor Bus
        run: python qa/audit_sc220_monitor_bus.py
      - name: Validate selectable PC endpoint and anti-loop routing
        run: python qa/audit_sc220_pc_endpoint_routing.py
      - name: Validate PC source versus monitor safety and capture recovery
        run: python qa/audit_sc220_pc_monitor_safety.py
      - name: Validate PC music-only atomic analyzer and safe cable source
        run: python qa/audit_sc220_pc_music_only.py
      - name: Validate clean-build executable unlock order
        run: python qa/audit_sc220_clean_build.py
      - name: Validate fixed transform reference
        run: python qa/verify_fixed_fft.py
      - name: Checkout private ASK-P authority when CI token is configured
        if: ${{ env.ASKP_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: masarray/askp-vst
          ref: 5757119cab7a1a75f09dcf0edea6e3be97975439
          token: ${{ secrets.ASKP_REPO_TOKEN }}
          path: third_party/askp-vst
      - name: Compile current profile and DSP audit
        if: ${{ env.ASKP_REPO_TOKEN != '' }}
        run: >-
          g++ -std=c++17 -O2
          -Ithird_party/askp-vst/engine
          qa/preset_profile_v0519_audit.cpp
          third_party/askp-vst/engine/arsonkupik_dsp.cpp
          third_party/askp-vst/engine/arsonkupik_presets.cpp
          -o /tmp/sonkupik-preset-profile-audit
      - name: Run current profile and DSP audit
        if: ${{ env.ASKP_REPO_TOKEN != '' }}
        run: /tmp/sonkupik-preset-profile-audit

  windows-wasapi-monitor:
    name: windows-wasapi-monitor
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Configure standalone WASAPI monitor and capture smoke target
        run: >-
          cmake
          -S qa/wasapi_monitor_smoke
          -B build-wasapi-monitor
          -G "Visual Studio 17 2022"
          -A x64
      - name: Compile native WASAPI monitor and capture with MSVC
        run: cmake --build build-wasapi-monitor --config Release --parallel 2
      - name: Run native monitor and capture lifecycle smoke test
        shell: pwsh
        run: .\build-wasapi-monitor\Release\SC220WasapiMonitorSmoke.exe
