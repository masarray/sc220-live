name: SC220 Live source audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASKP_REPO_TOKEN: ${{ secrets.ASKP_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-audit dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Generate aligned monitor-enabled SC220 sources
        run: >-
          cmake
          -DSC220_UI_SOURCE=${{ github.workspace }}/live/SC220MainComponent.cpp
          -DSC220_UI_GENERATED_SOURCE=${{ runner.temp }}/SC220MainComponent_Aligned.cpp
          -P cmake/GenerateSC220AlignedUi.cmake
      - name: Validate SC220 MIXER-01 device auto-detection
        run: python qa/audit_p0_sc220_device_detection.py
      - name: Validate real Windows Stream Output endpoint names
        run: python qa/audit_sc220_real_stream_endpoints.py
      - name: Validate Sonkupik static-noise clean integration
        run: python qa/audit_sc220_static_noise_clean.py
      - name: Guard proven monitor and programme analyzer runtime paths
        run: python qa/audit_sc220_runtime_regression_guard.py
      - name: Validate actual runtime sample-rate and buffer telemetry
        run: python qa/audit_sc220_runtime_clock_status.py
      - name: Validate P3 live routing denoise dual-mono and loudness
        run: python qa/audit_sc220_p3_live_ux.py
      - name: Validate P4 speech-aware ducking and clean LUFS UI
        run: python qa/audit_sc220_p4_smart_ducking.py
      - name: Validate P5 console polish app branding and expander ballistics
        run: python qa/audit_sc220_p5_console_polish.py
      - name: Validate P6A UI-only fader icon spacing and MUTE safety polish
        run: python qa/audit_sc220_p6a_ui_polish.py
      - name: Validate P6B frozen hiss cleanup and single-shape MUTE blink
        run: python qa/audit_sc220_p6b_noise_cleanup.py
      - name: Validate P6C DSP and Smart Protect illuminated status chips
        run: python qa/audit_sc220_p6c_status_chips.py
      - name: Validate P6D compact tray panel and SC220 tray icon
        run: python qa/audit_sc220_p6d_tray_polish.py
      - name: Validate P6E reliable tray and 90-day software-only licence
        run: python qa/audit_sc220_p6e_tray_trial_license.py
      - name: Validate P6F canonical SC220 app/tray icon assets
        run: python qa/audit_sc220_p6f_native_tray_icon.py
      - name: Validate ASK-P P0.3 effective-DSP port boundary
        run: python qa/audit_v0150_askp_p03_port.py
      - name: Validate SC220 dual-source broadcast bus
        run: python qa/audit_sc220_dual_source_bus.py
      - name: Validate SC220 premium UX contract
        run: python qa/audit_sc220_premium_ux.py
      - name: Validate aligned console and analyzer bridge
        run: python qa/audit_sc220_console_alignment.py
      - name: Validate independent physical Monitor Bus
        run: python qa/audit_sc220_monitor_bus.py
      - name: Validate selectable PC endpoint and anti-loop routing
        run: python qa/audit_sc220_pc_endpoint_routing.py
      - name: Validate public release gate and guidance
        run: python qa/audit_sc220_public_release.py
      - name: Validate verified VB-CABLE installer bundle
        run: python qa/audit_sc220_installer_bundle.py
      - name: Validate local release packaging contract
        run: python qa/audit_sc220_local_release.py
      - name: Validate clean-build executable unlock order
        run: python qa/audit_sc220_clean_build.py
      - name: Validate fixed transform reference
        run: python qa/verify_fixed_fft.py
      - name: Checkout private ASK-P P0.3 authority when CI token is configured
        if: ${{ env.ASKP_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: masarray/askp-vst
          ref: 240b9d3be3ca1fbdedfa5b7027e465c22a56b0ea
          token: ${{ secrets.ASKP_REPO_TOKEN }}
          path: third_party/askp-vst
      - name: Generate effective ASK-P P0.3 DSP
        if: ${{ env.ASKP_REPO_TOKEN != '' }}
        run: >-
          python third_party/askp-vst/scripts/generate_p0_musical_rebalance_dsp.py
          --input third_party/askp-vst/engine/arsonkupik_dsp.cpp
          --output /tmp/arsonkupik_dsp_p0_3.cpp
      - name: Compile current profile and effective DSP audit
        if: ${{ env.ASKP_REPO_TOKEN != '' }}
        run: >-
          g++ -std=c++17 -O2
          -Ithird_party/askp-vst/engine
          qa/preset_profile_v0519_audit.cpp
          /tmp/arsonkupik_dsp_p0_3.cpp
          third_party/askp-vst/engine/arsonkupik_presets.cpp
          -o /tmp/sonkupik-preset-profile-audit
      - name: Run current profile and effective DSP audit
        if: ${{ env.ASKP_REPO_TOKEN != '' }}
        run: /tmp/sonkupik-preset-profile-audit

  windows-wasapi-monitor:
    name: windows-wasapi-monitor
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Configure standalone WASAPI monitor and capture smoke target
        run: >-
          cmake
          -S qa/wasapi_monitor_smoke
          -B build-wasapi-monitor
          -G "Visual Studio 17 2022"
          -A x64
      - name: Compile native WASAPI monitor and capture with MSVC
        run: cmake --build build-wasapi-monitor --config Release --parallel 2
      - name: Run native monitor and capture lifecycle smoke test
        shell: pwsh
        run: .\build-wasapi-monitor\Release\SC220WasapiMonitorSmoke.exe

  windows-installer-template:
    name: windows-installer-template
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - name: Compile SC220 installer template with inert payloads
        shell: pwsh
        run: .\qa\compile_sc220_installer_template_smoke.ps1
